<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Liquidation quotation — Plaza Hotel</title>
<style>
  :root{--navy:#0B1F3A;--navy2:#0B1F3A;--gold:#e8a33d;--bg:#f1f3f7;--panel:#fff;--line:#e2e6ee;--ink:#1f2937;--dim:#6B7280;
        --green:#1e7e4f;--red:#c0392b;--amber:#94600f;--font:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
  header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:17px;letter-spacing:.3px}
  header .sub{color:#c9d3e4;font-size:12.5px}
  header .sp{flex:1}
  .seg{display:inline-flex;border:1px solid #3a4f70;border-radius:6px;overflow:hidden}
  .seg button{background:transparent;color:#c9d3e4;border:0;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}
  .seg button.on{background:var(--gold);color:var(--navy);font-weight:700}
  main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--navy2)}
  .msg{padding:10px 12px;border-radius:8px;margin-bottom:12px;white-space:pre-wrap}
  .msg.err{background:#fbeaea;color:var(--red)} .msg.ok{background:#e9f6ef;color:var(--green)} .msg.info{background:#eef3fb;color:#1f4e79}
  .msg.warn{background:#fff7e6;color:var(--amber)}
  .tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .tcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff}
  .tcard:hover,.tcard.on{border-color:var(--navy2);box-shadow:0 0 0 2px rgba(11,31,58,.12)}
  .tcard b{display:block;color:var(--navy2)} .tcard small{color:var(--dim)}
  .chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef1f6;color:#44506a}
  .chip.ok{background:#e3f3ea;color:var(--green)} .chip.warn{background:#fdf0dc;color:var(--amber)} .chip.bad{background:#fbe5e2;color:var(--red)}
  dl.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;margin:0}
  dl.kv dt{color:var(--dim);font-size:12.5px} dl.kv dd{margin:0}
  .pre{white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:middle;font-size:13px}
  th{background:#f5f7fb;color:var(--navy);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--navy)}
  td.n,th.n{text-align:right} td.c{text-align:center}
  tr.tot td{font-weight:700;background:#f5f7fb}
  input,select,textarea{font:inherit;color:var(--ink);border:1px solid #c8d1de;border-radius:5px;padding:5px 7px;width:100%;background:#fff}
  input:disabled,textarea:disabled{background:#f5f7fb;color:#444}
  textarea{min-height:60px;resize:vertical}
  .btn{border:1px solid #c8d1de;background:#fff;color:var(--ink);border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}
  .btn.pri{background:var(--navy2);border-color:var(--navy2);color:#fff}
  .btn.danger{color:var(--red)} .btn.tiny{padding:2px 8px;font-size:12px;font-weight:600}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .fld{display:flex;flex-direction:column;gap:3px;flex:1;min-width:200px}
  .fld label{font-size:12px;color:var(--dim)}
  .specgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px;padding:6px 2px}
  .specgrid label{font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
  tr.spec td{background:#fffdf3}
  .files li{margin:3px 0} .files{padding-left:18px;margin:6px 0}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .dim{color:var(--dim)} .hide{display:none}
  .wrap{overflow-x:auto}
  .kind{display:flex;gap:18px;margin-bottom:8px} .kind label{display:flex;gap:6px;align-items:center;font-weight:600}
  .kind input{width:auto}
  .agree{display:flex;gap:8px;align-items:flex-start;margin-top:10px} .agree input{width:auto;margin-top:3px}
  @media (max-width:700px){ dl.kv{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div><h1 id="hTitle">Thư báo giá thanh lý / Liquidation quotation</h1><div class="sub">PLAZA HOTEL COMPANY LIMITED</div></div>
  <span class="sp"></span>
  <div class="sub" id="hWho"></div>
  <div class="seg" id="lang"><button data-l="vi" class="on">VI</button><button data-l="en">EN</button></div>
</header>
<main>
  <div id="msg"></div>
  <div id="app"></div>
</main>
<script src="liquidation.js?v=20260926i"></script>
</body>
</html>

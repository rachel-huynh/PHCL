<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Management — Plaza Hotel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2316253c'/%3E%3Cg fill='%23fff'%3E%3Crect x='3' y='4' width='1.4' height='8'/%3E%3Crect x='5.4' y='4' width='.8' height='8'/%3E%3Crect x='7.2' y='4' width='1.6' height='8'/%3E%3Crect x='9.8' y='4' width='.8' height='8'/%3E%3Crect x='11.6' y='4' width='1.4' height='8'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --navy:#16253c; --navy-2:#1f3a5f; --navy-3:#0f1c2f;
    --side-ink:#c5d0de; --side-dim:#7e8fa6;
    --bg:#f4f5f7; --panel:#fff; --line:#e3e6ea; --line-2:#eef0f3; --head:#f7f8f9;
    --ink:#1b2a41; --dim:#6b7684;
    --blue:#2f6fb5; --red:#d0453e; --green:#2f9e63; --amber:#d9a327; --steel:#2e5c8a;
    /* Marker for the open item in the navy sidebar. Gold carries far more
       contrast against #16253c than the blue did. */
    --gold:#d2a13a;
    /* ONE typeface across the whole app. --mono keeps its name for the places
       that need figures to line up, but it is the same family now — those spots
       get tabular figures instead, so columns still align without a second
       typeface fighting the rest of the page. */
    --mono:system-ui,-apple-system,"Segoe UI",sans-serif;
    --side-w:248px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

  /* ---------------------------------------------------------- sidebar */
  /* Fixed height, not min-height: the grid below can only stretch to the window
     if something above it is actually bounded. */
  .shell{display:flex;height:100vh}
  aside{width:var(--side-w);flex:none;background:var(--navy);color:var(--side-ink);
        display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand b{display:block;color:#fff;font-size:15px;font-weight:700;line-height:1.25;
           letter-spacing:.01em;text-transform:uppercase}
  .brand span{display:block;margin-top:5px;color:var(--side-dim);font-size:11.5px}
  nav{flex:1;overflow:auto;padding:10px 0 4px}
  /* Cây điều hướng: nhóm gập/mở được, con thụt vào và có đường nối */
  nav .grp{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;
           padding:13px 16px 5px;color:var(--side-dim);font-size:10.5px;font-weight:600;
           letter-spacing:.11em;text-transform:uppercase;cursor:pointer;text-align:left;
           border-radius:0}
  nav .grp:hover{color:#fff}
  nav .grp .car{display:inline-block;width:9px;flex:none;font-size:9px;line-height:1;
                transition:transform .12s;transform:rotate(90deg)}
  nav .grp.shut .car{transform:rotate(0deg)}
  nav .grp .n{margin-left:auto;font-size:10px;opacity:.65;letter-spacing:0}
  nav .kids{border-left:1px solid rgba(255,255,255,.10);margin-left:22px}
  nav .kids.shut{display:none}
  nav .kids a{padding-left:14px}
  /* A child entry stays INSIDE its parent instead of levelling with it. */
  nav .kids a.sub{padding-left:30px;font-size:12.5px}
  nav .kids a.sub::before{content:'└';flex:none;width:9px;margin-left:-15px;
                          color:rgba(255,255,255,.3);font-size:11px;line-height:1}
  /* A heading inside a group: names what its children have in common, but is
     not itself a screen. */
  nav .kids .subhead{display:flex;align-items:center;gap:6px;width:100%;background:none;
                     border:none;border-radius:0;text-align:left;cursor:pointer;
                     padding:10px 18px 3px;color:var(--side-dim);font-size:10px;
                     font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  nav .kids .subhead:hover{color:#fff}
  nav .kids .subhead .car{display:inline-block;width:9px;flex:none;font-size:9px;
                          line-height:1;transition:transform .12s;transform:rotate(90deg)}
  nav .kids .subhead.shut .car{transform:rotate(0deg)}
  nav .kids .subkids.shut{display:none}
  nav a{display:flex;align-items:center;gap:8px;padding:7px 18px;color:var(--side-ink);
        font-size:13px;cursor:pointer;border-left:4px solid transparent;text-decoration:none}
  nav a:hover{background:rgba(255,255,255,.05);color:#fff}
  nav a.on{background:var(--navy-2);color:#fff;font-weight:600;border-left-color:var(--gold)}
  nav a.on::before{color:var(--gold)}
  nav a .tag{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;
             padding:0 6px;font-size:10.5px;font-weight:700;line-height:16px}
  nav a.on .tag{background:rgba(255,255,255,.22)}
  .foot{border-top:1px solid rgba(255,255,255,.08);padding:12px 18px 14px}
  .foot b{display:block;color:#fff;font-size:12.5px}
  .foot span{display:block;color:var(--side-dim);font-size:11px;margin-top:2px;
             word-break:break-all}
  .foot .sidenote{margin-top:10px;font-size:10.5px;line-height:1.45;color:var(--side-dim)}
  .conn{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;
        color:var(--side-dim)}
  .conn i{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
  .conn i.on{background:var(--green)}

  /* ------------------------------------------------------------ topbar */
  .content{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);
       border-bottom:1px solid var(--line);padding:11px 20px;position:sticky;top:0;z-index:5}
  .top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .tools{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  /* Công tắc ngôn ngữ EN/VI — English là ngôn ngữ chính thức */
  .seg{display:inline-flex;border:1px solid #cfd4da;border-radius:4px;overflow:hidden;flex:none}
  .seg button{border:none;background:var(--panel);color:var(--dim);padding:5px 11px;
              font-size:12px;font-weight:600;letter-spacing:.03em;border-radius:0}
  .seg button + button{border-left:1px solid #cfd4da}
  .seg button:hover{background:var(--head)}
  .seg button.on{background:var(--navy);color:#fff}
  main{padding:18px 20px 40px;flex:1}
  /* Explanatory prose is justified so it fills the page evenly instead of
     leaving a ragged edge; hyphenation stops the word gaps opening up. */
  .lead,.card > p,.hint{text-align:justify;hyphens:auto}
  .lead{color:var(--dim);font-size:12.5px;margin:-4px 0 16px}
  /* Descriptions are off until the ? in the top bar is pressed. */
  body.nohelp .lead,body.nohelp .card > p,body.nohelp .hint,
  body.nohelp .foots,body.nohelp .sidenote{display:none}
  .btn.help{flex:none;width:28px;padding:5px 0;text-align:center;font-weight:700;
            color:var(--dim)}
  .btn.help.on{background:var(--navy);border-color:var(--navy);color:#fff}
  /* Card heading and its actions share one line. */
  .chead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .chead > h2{margin:0;flex:1;min-width:0}
  .chead > .row{flex:none;margin:0}
  /* Figures line up by column without a second typeface. */
  .num,code,.kpi b,.tape .tp-code,textarea{font-variant-numeric:tabular-nums}
  /* Running number: narrow, quiet, never the thing the eye lands on. */
  th.idx,td.idx{width:52px;color:var(--dim);font-weight:400}
  th.delcol,td.delcol{width:34px;padding-left:9px;padding-right:0}
  th.overcol{padding-left:4px;padding-right:4px}
  .btn.ico{padding:0;width:26px;height:22px;line-height:1;font-size:14px;color:var(--dim)}
  .btn.ico:hover{color:var(--navy)}
  /* Per-column filter row, docked under the header of the register. */
  /* 4 + 1 border + 4 = the 9px the data cells use, so the filter box sits on
     the same margin as its column. */
  tr.colf th{background:var(--panel);padding:4px;position:static;border-top:none}
  tr.colf input{padding:3px 4px;font-size:11.5px;font-weight:400;
                text-transform:none;letter-spacing:0}

  /* ------------------------------------------------------------ pieces */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
        padding:15px 16px;margin-bottom:14px}
  /* Also .chead h2: layoutCards() moves the heading inside .chead, and a child
     combinator would stop matching it — that is what left some headings large
     and lower-case while others stayed small caps. */
  .card > h2,.chead > h2{margin:0 0 3px;font-size:13px;font-weight:700;letter-spacing:.02em;
             text-transform:uppercase}
  .card > h2 em,.chead > h2 em{font-style:normal;font-weight:400;color:var(--dim);text-transform:none;
                letter-spacing:0}
  .card > p{margin:0 0 12px;color:var(--dim);font-size:12.5px;max-width:96ch}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
  /* A row that holds only actions (no input field) ranges its buttons right,
     so every card's controls sit on the same edge and are easy to find. */
  .card .row:not(:has(.fld)){justify-content:flex-end}
  /* When actions share a row WITH fields, they still finish on the right edge —
     but on the same line, rather than costing a whole extra row of whitespace. */
  .card .row:has(.fld) > button:first-of-type{margin-left:auto}
  .fld{min-width:150px}
  .fld.grow{flex:1}
  label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;
        text-transform:uppercase;color:var(--dim);margin-bottom:4px}

  input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);
    border:1px solid #cfd4da;border-radius:4px;padding:5px 8px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);
    box-shadow:0 0 0 2px rgba(47,111,181,.15)}
  textarea{font-family:var(--mono);font-size:12px;min-height:104px;resize:vertical}

  button{font:inherit;cursor:pointer;border-radius:4px;padding:5px 12px;width:auto;
         font-size:12.5px;white-space:nowrap}
  .btn{background:var(--panel);border:1px solid #cfd4da;color:var(--ink)}
  .btn:hover{background:var(--head)}
  .btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .btn.pri:hover{background:var(--navy-2)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.pri:disabled:hover{background:var(--navy)}
  .xbtn{background:none;border:1px solid var(--line);color:var(--dim);padding:0 6px;
        line-height:18px;font-size:12px;border-radius:3px}
  .xbtn:hover{color:var(--red);border-color:var(--red)}

  /* KPI cards — vạch màu bên trái như dashboard BOD */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;
        margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--steel);
       border-radius:5px;padding:11px 14px}
  .kpi.r{border-left-color:var(--red)} .kpi.a{border-left-color:var(--amber)}
  .kpi.g{border-left-color:var(--green)} .kpi.n{border-left-color:var(--navy)}
  .kpi label{margin:0 0 5px}
  .kpi b{display:block;font-size:20px;font-weight:700;font-family:var(--mono);
         letter-spacing:-.02em;line-height:1.15;word-break:break-all}
  .kpi small{display:block;margin-top:4px;color:var(--dim);font-size:11.5px}

  /* danh sách có vạch màu, kiểu "Top 5 things to look at" */
  .notes{display:grid;gap:9px}
  .note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--steel);
        border-radius:5px;padding:9px 13px;font-size:12.5px}
  .note.r{border-left-color:var(--red)} .note.a{border-left-color:var(--amber)}
  .note.g{border-left-color:var(--green)}
  .note b{display:block;margin-bottom:2px;font-size:13px}
  .note span{color:var(--dim)}

  /* The main grid of a screen fills the window instead of stopping short and
     leaving dead space below it. */
  .wrap{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:6px;
        background:var(--panel)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{border-bottom:1px solid var(--line-2);padding:5px 9px;text-align:left;
        white-space:nowrap;vertical-align:top}
  th{position:sticky;top:0;background:var(--head);z-index:1;font-size:10.5px;font-weight:700;
     text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
     border-bottom:1px solid var(--line)}
  tbody tr:hover{background:#fafbfc}
  td input,td select{border:1px solid transparent;background:none;padding:2px 4px}
  /* An input carries its own 1px border + 4px padding INSIDE the cell, which
     pushed its text 5px past the column heading. Take those 5px off the cell so
     content and heading share one margin, on both edges. */
  td:has(> input),td:has(> select){padding-left:4px;padding-right:4px}
  td.num:has(> input){text-align:right}
  td.num input{text-align:right}
  td input:focus,td select:focus{background:var(--panel);border-color:var(--blue)}
  td input[type=checkbox]{width:auto;margin:3px 0 0}
  tr.dirty td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
  tr.new td:first-child{box-shadow:inset 3px 0 0 var(--green)}
  .num{text-align:right;font-family:var(--mono)}
  /* ---- Outline tree inside the editable grid -------------------------
     Guide rules + elbows, so a row's branch is readable at a glance; the
     first level is set like a heading and deeper levels step back.      */
  tr.grp td{background:var(--head);color:var(--navy);padding:7px 10px;
            border-top:1px solid #dfe3e9;border-bottom:1px solid #dfe3e9}
  tr.grp .gt{font-weight:700;font-size:11.5px;letter-spacing:.4px;
             font-family:var(--mono)}
  tr.grp .gn{font-size:10.5px;color:var(--dim);margin-left:8px;font-weight:400}
  tr.ctx{opacity:.45}                /* an ancestor shown only for context */

  /* Rules drawn with borders over the cell's full height, so they join between
     rows. Box-drawing glyphs leave a gap at every row edge and read as dashes. */
  td.tcell{white-space:nowrap;position:relative}
  .guides{position:absolute;left:0;top:0;bottom:0;display:flex;pointer-events:none}
  .guides .g{width:15px;flex:none;position:relative}
  .guides .g.v::before,.guides .g.t::before,.guides .g.e::before{
    content:'';position:absolute;left:7px;width:0;border-left:1px solid #ccd3dd}
  .guides .g.v::before,.guides .g.t::before{top:0;bottom:0}
  .guides .g.e::before{top:0;height:50%}
  .guides .g.t::after,.guides .g.e::after{
    content:'';position:absolute;left:7px;top:50%;width:8px;height:0;
    border-top:1px solid #ccd3dd}
  .caret{width:15px;flex:none;border:none;background:none;padding:0;margin-right:2px;
         color:#7d879a;font-size:10px;line-height:1;cursor:pointer;
         vertical-align:middle}
  .caret:hover{color:var(--navy)}
  .caret.pad{cursor:default;display:inline-block}
  /* First level reads as a heading, deeper levels recede. */
  td.lvl0 input{font-weight:700;color:var(--navy)}
  td.lvl1 input{font-weight:600}
  td.lvl2 input{color:#4a5262}
  /* Evidence badge beside a suggested category: how many register rows back it. */
  .sug{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:9px;
       font-family:var(--mono);font-size:10.5px;font-weight:700;cursor:help;
       background:#e6f2ea;color:#1c6b3f}
  .sug.weak{background:#fdf1dc;color:#8a5a12}
  .sug.none{background:#fbe3e3;color:#95241f}
  .neg{color:var(--red);font-weight:600} .pos{color:var(--green)}
  code{font-family:var(--mono);font-size:12px}

  .msg{padding:9px 12px;border-radius:5px;margin:10px 0;font-size:12.5px;
       border:1px solid var(--line);border-left:4px solid var(--steel);
       background:var(--panel);white-space:pre-wrap}
  .msg.ok{border-left-color:var(--green)}
  .msg.warn{border-left-color:var(--amber)}
  .msg.err{border-left-color:var(--red)}
  .msg.info{border-left-color:var(--blue)}
  .hint{font-size:11.5px;color:var(--dim);margin-top:7px}
  .foots{font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.5}
  details{margin-top:12px}
  summary{cursor:pointer;font-size:12.5px;color:var(--blue);font-weight:600}
  section{display:none}
  section.on{display:block}
  /* The two screens that are mostly one big grid stretch it to the window, so
     the table fills the view instead of stopping short with dead space under
     it. Flex column + flex:1 on the grid keeps this right whatever is above —
     the description shown or hidden, one filter row or two. */
  main{display:flex;flex-direction:column;min-height:0;overflow:auto}
  section#v-table.on,section#v-register.on{display:flex;flex-direction:column;
                                           flex:1;min-height:0}
  #v-table .wrap,#v-register > .wrap{flex:1;min-height:220px;max-height:none}

  /* Bộ chọn cột của sổ tài sản */
  .colpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px}
  .colpick .ci{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;
               border:1px solid var(--line-2);font-size:12.5px}
  .colpick .ci.on{border-color:var(--blue);background:var(--head)}
  .colpick .ci input{width:auto;margin:0}
  .colpick .ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .colpick .ci button{padding:0 5px;line-height:17px;font-size:11px;border:1px solid var(--line);
                      background:var(--panel);color:var(--dim);border-radius:3px}
  .colpick .ci button:hover{color:var(--ink);border-color:var(--blue)}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}
  th .dir{color:var(--blue);font-size:9px;margin-left:3px}

  /* ------------------------------------------------- biên bản ALR / tem */
  #printRoot{background:#fff;border:1px solid var(--line);border-radius:6px;
             padding:12mm 10mm;margin-top:14px;color:#000}
  #printRoot:empty{display:none}
  /* Company identity left, document identity right — as the source form. */
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;
            gap:20px;margin-bottom:12px}
  .doc-head .left{text-align:left}
  .doc-head .right{text-align:right}
  .doc-head .co{font-weight:700;font-size:13px;text-transform:uppercase}
  .doc-head .addr{font-size:11.5px;color:#333;margin-top:1px}
  .doc-head .ttl{font-weight:700;font-size:14.5px;text-transform:uppercase}
  .doc-head .meta{font-size:12px;margin-top:6px}
  .doc-head .meta b{font-weight:600;margin-right:4px}
  .doc-meta{display:flex;gap:34px;font-size:12px;margin:9px 0 12px}
  .doc-meta b{font-weight:600}
  /* Empty box the receiver ticks once the label is attached. */
  table.doc .tick{display:inline-block;width:11px;height:11px;border:1px solid #000}
  table.doc{border-collapse:collapse;width:100%;font-size:11px;table-layout:fixed}
  table.doc th,table.doc td{border:1px solid #000;padding:3px 5px;vertical-align:top;
                            white-space:normal;word-wrap:break-word}
  table.doc th{background:#eceff3;text-align:center;font-size:10px;font-weight:700;
               text-transform:none;letter-spacing:0;position:static;color:#000}
  table.doc td.c{text-align:center}
  table.doc th.r, table.doc td.r{text-align:right}
  table.doc .lbl{text-align:center}
  table.doc .lbl svg{display:block;margin:0 auto;max-width:100%}
  .doc-notes{margin-top:12px;font-size:10.5px;line-height:1.45;white-space:pre-wrap}
  .doc-sign{display:flex;justify-content:space-between;margin-top:26px;font-size:11.5px;
            text-align:center}
  .doc-sign div{flex:1}
  .doc-sign b{display:block;font-weight:600}
  .doc-sign i{display:block;height:58px}

  .sheet{display:grid;gap:4mm;grid-template-columns:repeat(var(--cols,3),1fr)}
  .lab{border:1px dashed #999;border-radius:2px;padding:3mm;text-align:center;
       break-inside:avoid}
  .lab svg{display:block;margin:0 auto;max-width:100%}
  .lab .nm{font-size:9px;margin-top:1mm;line-height:1.25;color:#000;
           overflow:hidden;max-height:2.6em}
  .lab .cd{font-size:8.5px;color:#333;font-family:var(--mono)}

  /* ---- Brother PT-P900W, 18 mm tape ----------------------------------
     Geometry copied from the P-touch templates: 63.5 x 18 mm per label,
     61.5 x 16.5 mm printable. One label per printed page, so @page is set
     to exactly one label and the printer's auto-cut lands between them.
     On screen they are stacked with a dashed edge to preview the run.    */
  .tape-wrap{display:flex;flex-direction:column;gap:3mm;align-items:flex-start}
  .tape{width:63.5mm;height:18mm;box-sizing:border-box;padding:0.75mm 1mm;
        display:flex;align-items:center;gap:1mm;overflow:hidden;
        background:#fff;color:#000;border:1px dashed #b9c0cb;break-inside:avoid}
  .tape .tp-co{width:13mm;flex:none;font-size:6.2pt;font-weight:700;line-height:1.15;
               letter-spacing:.2px;text-align:center}
  .tape .tp-mid{flex:1;min-width:0}
  .tape .tp-code{font-family:var(--mono);font-size:7.5pt;font-weight:700;
                 line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tape .tp-name{font-size:5.8pt;line-height:1.2;margin-top:.5mm;
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tape .tp-qr{width:15mm;height:15mm;flex:none;display:flex;align-items:center}
  .tape .tp-qr svg{display:block}

  @media print{
    aside,.top,.lead,.card,.foots,section:not(.on){display:none!important}
    body{background:#fff}
    /* The screen layout pins the window height and scrolls inside main; on
       paper that would clip everything past the first screenful. */
    main{padding:0;display:block;overflow:visible;height:auto}
    .shell{display:block;height:auto}
    section#v-table.on,section#v-register.on{display:block}
    #v-table .wrap,#v-register > .wrap{height:auto;max-height:none;overflow:visible}
    #printRoot{border:none;border-radius:0;padding:0;margin:0}
    .lab{border-style:solid;border-color:#ccc}
    /* One tape label per page, no gap and no preview edge — the printer's own
       cut separates them, a border would waste tape and shift the content. */
    .tape-wrap{display:block;gap:0}
    .tape{border:none;page-break-after:always;break-after:page}
    .tape:last-child{page-break-after:auto;break-after:auto}
  }

  @media (max-width:860px){
    /* Stacked on a narrow screen, so the window height must NOT be pinned —
       the sidebar would eat all of it and leave the content nothing. */
    .shell{flex-direction:column;height:auto}
    main{overflow:visible}
    section#v-table.on,section#v-register.on{display:block}
    #v-table .wrap,#v-register > .wrap{height:auto;max-height:66vh}
    aside{width:auto;height:auto;position:static}
    nav{display:flex;flex-wrap:wrap;padding:6px}
    nav .grp{width:100%;padding:8px 12px 3px}
    nav a{border-left:none;border-bottom:3px solid transparent;padding:6px 12px}
    nav a.on{border-left:none;border-bottom-color:var(--gold)}
  }
</style>
</head>

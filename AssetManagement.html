  .chartcard{display:flex;flex-direction:column}
  .chartcard .cbody{flex:1;display:flex;flex-direction:column;justify-content:center}
  /* Timeline grouped by department. */
  .gseg{margin-bottom:8px}
  .ghead{display:flex;gap:8px;align-items:baseline;padding:8px 0 3px;border-bottom:1px solid var(--line);margin-top:4px}
  .ghead b{font-size:12px;color:var(--navy)} .ghead small{font-size:11px;color:var(--dim)}
  /* To-do list: what was already done, ticked and faded. */
  #wiGrid tr.done td{color:var(--dim);opacity:.62}
  #wiGrid tr.done:hover td{opacity:1}
  /* Approval chains as a workflow diagram (user 25/09/2026). */
  .wflow{margin-top:12px;display:flex;flex-direction:column;gap:12px}
  .fcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
  .fcard h3{margin:0 0 8px;font-size:12.5px;color:var(--navy);font-weight:600} .fcard h3 b{font-weight:800}
  .fscroll2{overflow-x:auto;padding-bottom:4px}
  .fline{display:flex;align-items:flex-start;gap:6px;min-width:max-content}
  .farrow{align-self:flex-start;margin-top:18px;color:var(--dim);font-size:18px;line-height:1}
  .fnode{width:150px;border:1px solid var(--line);border-top:4px solid #9aa6b8;border-radius:7px;padding:6px 8px;background:#fff;display:flex;flex-direction:column;gap:2px}
  .fnode small{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}

<!-- Sign-in. Covers the whole app until there is a session. It is a <form> so
     Enter submits and the browser offers to remember the password. The same
     box doubles as "set a new password" — after the reset e-mail, or from the
     sidebar. -->
<!-- Hand-drawn signature (phase 4): finger or Apple Pencil on an iPad, mouse on
     a PC. The drawing is copied into the approval step it signs. -->
<div class="login sigmodal" id="sigModal" hidden>
  <div class="sigbox">
    <h2 id="sigTitle"></h2>
    <p class="siglead" data-i18n="sig.lead"></p>
    <div class="sigpadwrap"><canvas id="sigPad"></canvas><span class="sigline" data-i18n="sig.here"></span></div>
    <div id="sigMsg"></div>
    <label class="sigchk"><input type="checkbox" id="sigSave"> <span data-i18n="sig.save"></span></label>
    <div class="sigacts">
      <button class="btn" id="sigUseSaved" type="button" data-i18n="sig.useSaved" hidden></button>
      <button class="btn" id="sigClear" type="button" data-i18n="sig.clear"></button>
      <span style="flex:1"></span>
      <button class="btn" id="sigSkip" type="button" data-i18n="sig.skip" hidden></button>
      <button class="btn" id="sigCancel" type="button" data-i18n="sig.cancel"></button>
      <button class="btn pri" id="sigOk" type="button" data-i18n="sig.ok"></button>
    </div>
  </div>
</div>

<div class="login" id="login" hidden>
  <form class="lcard" id="loginForm" autocomplete="on" novalidate>
    <div class="lhead">
      <div class="lbrand"><b>Plaza Hotel Company Limited</b>
        <span data-i18n="app.subtitle"></span></div>
      <div class="seg" id="loginLang">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="vi">VI</button>
      </div>
    </div>
    <div id="loginIn">
      <div class="fld"><label for="liEmail" data-i18n="auth.email"></label>
        <input id="liEmail" type="email" autocomplete="username" spellcheck="false"></div>
      <div class="fld"><label for="liPw" data-i18n="auth.password"></label>
        <input id="liPw" type="password" autocomplete="current-password"></div>
      <button class="btn pri wide" id="btnSignIn" type="submit" data-i18n="auth.signIn"></button>
      <div class="lrow">
        <button type="button" class="lnk" id="btnForgot" data-i18n="auth.forgot"></button>
        <button type="button" class="lnk" id="btnLoginSetup" data-i18n="auth.connSettings"></button>
      </div>
    </div>
    <div id="loginNew" hidden>
      <p class="lnote" data-i18n="auth.setNewLead"></p>
      <div class="fld"><label for="liNew1" data-i18n="auth.newPw"></label>
        <input id="liNew1" type="password" autocomplete="new-password"></div>
      <div class="fld"><label for="liNew2" data-i18n="auth.newPw2"></label>
        <input id="liNew2" type="password" autocomplete="new-password"></div>
      <div class="lrow">
        <button class="btn" id="btnPwCancel" type="button" data-i18n="auth.cancel"></button>
        <button class="btn pri" id="btnSetPw" type="button" data-i18n="auth.setPw"></button>
      </div>
    </div>
    <div id="loginMsg"></div>
  </form>
</div>

<div class="shell">

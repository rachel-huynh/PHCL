<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Intake — Plaza Hotel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2316253c'/%3E%3Cg fill='%23fff'%3E%3Crect x='3' y='4' width='1.4' height='8'/%3E%3Crect x='5.4' y='4' width='.8' height='8'/%3E%3Crect x='7.2' y='4' width='1.6' height='8'/%3E%3Crect x='9.8' y='4' width='.8' height='8'/%3E%3Crect x='11.6' y='4' width='1.4' height='8'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --navy:#16253c; --navy-2:#1f3a5f; --navy-3:#0f1c2f;
    --side-ink:#c5d0de; --side-dim:#7e8fa6;
    --bg:#f4f5f7; --panel:#fff; --line:#e3e6ea; --line-2:#eef0f3; --head:#f7f8f9;
    --ink:#1b2a41; --dim:#6b7684;
    --blue:#2f6fb5; --red:#d0453e; --green:#2f9e63; --amber:#d9a327; --steel:#2e5c8a;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
    --side-w:248px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

  /* ---------------------------------------------------------- sidebar */
  .shell{display:flex;min-height:100vh}
  aside{width:var(--side-w);flex:none;background:var(--navy);color:var(--side-ink);
        display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand b{display:block;color:#fff;font-size:15px;font-weight:700;line-height:1.25;
           letter-spacing:.01em;text-transform:uppercase}
  .brand span{display:block;margin-top:5px;color:var(--side-dim);font-size:11.5px}
  nav{flex:1;overflow:auto;padding:10px 0 4px}
  nav .grp{padding:14px 18px 5px;color:var(--side-dim);font-size:10.5px;font-weight:600;
           letter-spacing:.11em;text-transform:uppercase}
  nav a{display:flex;align-items:center;gap:8px;padding:7px 18px;color:var(--side-ink);
        font-size:13px;cursor:pointer;border-left:3px solid transparent;text-decoration:none}
  nav a:hover{background:rgba(255,255,255,.05);color:#fff}
  nav a.on{background:var(--navy-2);color:#fff;font-weight:600;border-left-color:var(--blue)}
  nav a .tag{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;
             padding:0 6px;font-size:10.5px;font-weight:700;line-height:16px}
  nav a.on .tag{background:rgba(255,255,255,.22)}
  .foot{border-top:1px solid rgba(255,255,255,.08);padding:12px 18px 14px}
  .foot b{display:block;color:#fff;font-size:12.5px}
  .foot span{display:block;color:var(--side-dim);font-size:11px;margin-top:2px;
             word-break:break-all}
  .foot .sidenote{margin-top:10px;font-size:10.5px;line-height:1.45;color:var(--side-dim)}
  .conn{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;
        color:var(--side-dim)}
  .conn i{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
  .conn i.on{background:var(--green)}

  /* ------------------------------------------------------------ topbar */
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);
       border-bottom:1px solid var(--line);padding:11px 20px;position:sticky;top:0;z-index:5}
  .top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .tools{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  /* Công tắc ngôn ngữ EN/VI — English là ngôn ngữ chính thức */
  .seg{display:inline-flex;border:1px solid #cfd4da;border-radius:4px;overflow:hidden;flex:none}
  .seg button{border:none;background:var(--panel);color:var(--dim);padding:5px 11px;
              font-size:12px;font-weight:600;letter-spacing:.03em;border-radius:0}
  .seg button + button{border-left:1px solid #cfd4da}
  .seg button:hover{background:var(--head)}
  .seg button.on{background:var(--navy);color:#fff}
  main{padding:18px 20px 40px;flex:1}
  .lead{color:var(--dim);font-size:12.5px;margin:-4px 0 16px;max-width:96ch}

  /* ------------------------------------------------------------ pieces */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
        padding:15px 16px;margin-bottom:14px}
  .card > h2{margin:0 0 3px;font-size:13px;font-weight:700;letter-spacing:.02em;
             text-transform:uppercase}
  .card > h2 em{font-style:normal;font-weight:400;color:var(--dim);text-transform:none;
                letter-spacing:0}
  .card > p{margin:0 0 12px;color:var(--dim);font-size:12.5px;max-width:96ch}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
  .fld{min-width:150px}
  .fld.grow{flex:1}
  label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;
        text-transform:uppercase;color:var(--dim);margin-bottom:4px}

  input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);
    border:1px solid #cfd4da;border-radius:4px;padding:5px 8px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);
    box-shadow:0 0 0 2px rgba(47,111,181,.15)}
  textarea{font-family:var(--mono);font-size:12px;min-height:104px;resize:vertical}

  button{font:inherit;cursor:pointer;border-radius:4px;padding:5px 12px;width:auto;
         font-size:12.5px;white-space:nowrap}
  .btn{background:var(--panel);border:1px solid #cfd4da;color:var(--ink)}
  .btn:hover{background:var(--head)}
  .btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .btn.pri:hover{background:var(--navy-2)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.pri:disabled:hover{background:var(--navy)}
  .xbtn{background:none;border:1px solid var(--line);color:var(--dim);padding:0 6px;
        line-height:18px;font-size:12px;border-radius:3px}
  .xbtn:hover{color:var(--red);border-color:var(--red)}

  /* KPI cards — vạch màu bên trái như dashboard BOD */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;
        margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--steel);
       border-radius:5px;padding:11px 14px}
  .kpi.r{border-left-color:var(--red)} .kpi.a{border-left-color:var(--amber)}
  .kpi.g{border-left-color:var(--green)} .kpi.n{border-left-color:var(--navy)}
  .kpi label{margin:0 0 5px}
  .kpi b{display:block;font-size:20px;font-weight:700;font-family:var(--mono);
         letter-spacing:-.02em;line-height:1.15;word-break:break-all}
  .kpi small{display:block;margin-top:4px;color:var(--dim);font-size:11.5px}

  /* danh sách có vạch màu, kiểu "Top 5 things to look at" */
  .notes{display:grid;gap:9px}
  .note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--steel);
        border-radius:5px;padding:9px 13px;font-size:12.5px}
  .note.r{border-left-color:var(--red)} .note.a{border-left-color:var(--amber)}
  .note.g{border-left-color:var(--green)}
  .note b{display:block;margin-bottom:2px;font-size:13px}
  .note span{color:var(--dim)}

  .wrap{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:6px;
        background:var(--panel)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{border-bottom:1px solid var(--line-2);padding:5px 9px;text-align:left;
        white-space:nowrap;vertical-align:top}
  th{position:sticky;top:0;background:var(--head);z-index:1;font-size:10.5px;font-weight:700;
     text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
     border-bottom:1px solid var(--line)}
  tbody tr:hover{background:#fafbfc}
  td input,td select{border:1px solid transparent;background:none;padding:2px 4px}
  td input:focus,td select:focus{background:var(--panel);border-color:var(--blue)}
  td input[type=checkbox]{width:auto;margin:3px 0 0}
  tr.dirty td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
  tr.new td:first-child{box-shadow:inset 3px 0 0 var(--green)}
  .num{text-align:right;font-family:var(--mono)}
  .neg{color:var(--red);font-weight:600} .pos{color:var(--green)}
  code{font-family:var(--mono);font-size:12px}

  .msg{padding:9px 12px;border-radius:5px;margin:10px 0;font-size:12.5px;
       border:1px solid var(--line);border-left:4px solid var(--steel);
       background:var(--panel);white-space:pre-wrap}
  .msg.ok{border-left-color:var(--green)}
  .msg.warn{border-left-color:var(--amber)}
  .msg.err{border-left-color:var(--red)}
  .msg.info{border-left-color:var(--blue)}
  .hint{font-size:11.5px;color:var(--dim);margin-top:7px}
  .foots{font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.5;max-width:100ch}
  details{margin-top:12px}
  summary{cursor:pointer;font-size:12.5px;color:var(--blue);font-weight:600}
  section{display:none}
  section.on{display:block}

  /* ------------------------------------------------- biên bản ALR / tem */
  #printRoot{background:#fff;border:1px solid var(--line);border-radius:6px;
             padding:12mm 10mm;margin-top:14px;color:#000}
  #printRoot:empty{display:none}
  .doc-head{text-align:center;margin-bottom:10px}
  .doc-head .co{font-weight:700;font-size:13px;text-transform:uppercase}
  .doc-head .addr{font-size:11.5px;color:#333;margin-top:1px}
  .doc-head .ttl{font-weight:700;font-size:14.5px;margin-top:11px;text-transform:uppercase}
  .doc-meta{display:flex;gap:34px;font-size:12px;margin:9px 0 12px}
  .doc-meta b{font-weight:600}
  table.doc{border-collapse:collapse;width:100%;font-size:11px;table-layout:fixed}
  table.doc th,table.doc td{border:1px solid #000;padding:3px 5px;vertical-align:top;
                            white-space:normal;word-wrap:break-word}
  table.doc th{background:#eceff3;text-align:center;font-size:10px;font-weight:700;
               text-transform:none;letter-spacing:0;position:static;color:#000}
  table.doc td.c{text-align:center} table.doc td.r{text-align:right}
  table.doc .lbl{text-align:center}
  table.doc .lbl svg{display:block;margin:0 auto;max-width:100%}
  .doc-notes{margin-top:12px;font-size:10.5px;line-height:1.45;white-space:pre-wrap}
  .doc-sign{display:flex;justify-content:space-between;margin-top:26px;font-size:11.5px;
            text-align:center}
  .doc-sign div{width:44%}
  .doc-sign b{display:block;font-weight:600}
  .doc-sign i{display:block;height:58px}

  .sheet{display:grid;gap:4mm;grid-template-columns:repeat(var(--cols,3),1fr)}
  .lab{border:1px dashed #999;border-radius:2px;padding:3mm;text-align:center;
       break-inside:avoid}
  .lab svg{display:block;margin:0 auto;max-width:100%}
  .lab .nm{font-size:9px;margin-top:1mm;line-height:1.25;color:#000;
           overflow:hidden;max-height:2.6em}
  .lab .cd{font-size:8.5px;color:#333;font-family:var(--mono)}

  @media print{
    aside,.top,.lead,.card,.foots,section:not(.on){display:none!important}
    body{background:#fff}
    main{padding:0}
    .shell{display:block}
    #printRoot{border:none;border-radius:0;padding:0;margin:0}
    .lab{border-style:solid;border-color:#ccc}
  }

  @media (max-width:860px){
    .shell{flex-direction:column}
    aside{width:auto;height:auto;position:static}
    nav{display:flex;flex-wrap:wrap;padding:6px}
    nav .grp{width:100%;padding:8px 12px 3px}
    nav a{border-left:none;border-bottom:3px solid transparent;padding:6px 12px}
    nav a.on{border-left:none;border-bottom-color:var(--blue)}
  }
</style>
</head>
<body>
<div class="shell">

<aside>
  <div class="brand">
    <b>Plaza Hotel<br>Company Limited</b>
    <span data-i18n="app.subtitle"></span>
  </div>
  <nav id="nav"></nav>
  <div class="foot">
    <b>Rachel Huynh</b>
    <span>projectassistant@jvcplaza.vn</span>
    <div class="conn"><i id="dot"></i><span id="connTxt"></span></div>
    <div class="sidenote" data-i18n="side.note"></div>
  </div>
</aside>

<div class="content">
  <div class="top">
    <h1 id="pageTitle"></h1>
    <div class="tools" id="tools"></div>
    <div class="seg" id="langSeg">
      <button data-lang="en">EN</button><button data-lang="vi">VI</button>
    </div>
  </div>

  <main>

  <section id="v-setup">
    <p class="lead" data-i18n-html="setup.lead_html"></p>
    <div class="grid2">
      <div class="card">
        <h2 data-i18n="setup.h.conn"></h2>
        <div class="row" style="margin-bottom:10px">
          <div class="fld grow"><label data-i18n="setup.projectUrl"></label>
            <input id="sbUrl" placeholder="https://xxxxxxxx.supabase.co" spellcheck="false"></div>
        </div>
        <div class="row" style="margin-bottom:12px">
          <div class="fld grow"><label data-i18n="setup.anonKey"></label>
            <input id="sbKey" placeholder="eyJhbGciOi…" spellcheck="false"></div>
        </div>
        <div class="row">
          <button class="btn pri" id="btnSave" data-i18n="setup.save"></button>
          <button class="btn" id="btnLink" data-i18n="setup.link"></button>
          <button class="btn" id="btnForget" data-i18n="setup.forget"></button>
        </div>
        <div id="setupMsg"></div>
      </div>
      <div class="card">
        <h2 data-i18n="setup.h.check"></h2>
        <p data-i18n-html="setup.check.p_html"></p>
        <button class="btn" id="btnCheck" data-i18n="setup.check.btn"></button>
        <div id="checkOut"></div>
      </div>
    </div>
  </section>

  <section id="v-table">
    <p class="lead" id="tableLead"></p>
    <div id="dataMsg"></div>
    <div class="wrap"><table id="grid"><thead></thead><tbody></tbody></table></div>
    <p class="foots" data-i18n-html="table.foot_html"></p>
  </section>

  <section id="v-counter">
    <p class="lead" data-i18n-html="cnt.lead_html"></p>
    <div id="cntOut"></div>

    <div class="card">
      <h2 data-i18n="cnt.seed.h"></h2>
      <p data-i18n-html="cnt.seed.p_html"></p>
      <div class="fld grow" style="margin-bottom:11px">
        <label data-i18n="cnt.seed.file"></label>
        <input type="file" id="seedFile" multiple accept=".xlsx,.xlsm,.csv,.txt">
      </div>
      <div class="fld grow">
        <label data-i18n="cnt.seed.paste"></label>
        <textarea id="seedText" placeholder="FBD.C2422.LTU.2025.00309&#10;JVC.000006870&#10;…"></textarea>
      </div>
      <div class="row" style="margin-top:11px">
        <button class="btn" id="btnScan" data-i18n="cnt.seed.scan"></button>
        <button class="btn pri" id="btnSeed" disabled data-i18n="cnt.seed.run"></button>
      </div>
      <div id="seedOut"></div>
    </div>
  </section>

  <section id="v-rules">
    <p class="lead" data-i18n="rules.lead"></p>
    <div class="card">
      <h2 data-i18n="rules.classify.h"></h2>
      <div class="row">
        <div class="fld" style="max-width:180px"><label data-i18n="rules.price"></label>
          <input id="rcPrice" type="number" value="35000000"></div>
        <div class="fld" style="max-width:230px"><label data-i18n="rules.category"></label>
          <select id="rcCat"></select></div>
        <div class="fld" style="max-width:190px"><label data-i18n="rules.intangible"></label>
          <select id="rcIntan">
            <option value="false" data-i18n="rules.intNo"></option>
            <option value="true" data-i18n="rules.intYes"></option></select></div>
        <button class="btn pri" id="btnClassify" data-i18n="rules.check"></button>
      </div>
      <div id="rcOut"></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2 data-i18n="rules.origin.h"></h2>
        <p data-i18n-html="rules.origin.p_html"></p>
        <div class="row">
          <div class="fld grow"><input id="orRaw" value="USA/Mexico/China/Singapore"></div>
          <button class="btn pri" id="btnOrigin" data-i18n="rules.check"></button>
        </div>
        <div class="hint" data-i18n-html="rules.origin.try_html"></div>
        <div id="orOut"></div>
      </div>

      <div class="card">
        <h2><span data-i18n="rules.preview.h"></span> <em data-i18n="rules.preview.em"></em></h2>
        <div class="row">
          <div class="fld" style="max-width:130px"><label data-i18n="rules.dept"></label>
            <select id="pvDept"></select></div>
          <div class="fld" style="max-width:200px"><label data-i18n="rules.category"></label>
            <select id="pvCat"></select></div>
          <div class="fld" style="max-width:100px"><label data-i18n="rules.year"></label>
            <input id="pvYear" type="number" value="2026"></div>
          <div class="fld" style="max-width:100px"><label data-i18n="rules.seq"></label>
            <input id="pvSeq" type="number" value="1"></div>
          <button class="btn pri" id="btnPreview" data-i18n="rules.build"></button>
        </div>
        <div id="pvOut"></div>
      </div>
    </div>
  </section>

  <section id="v-alr">
    <p class="lead" data-i18n-html="alr.lead_html"></p>

    <div class="card">
      <h2 data-i18n="alr.step1"></h2>
      <div class="row">
        <div class="fld" style="max-width:220px"><label data-i18n="alr.shipment"></label>
          <select id="alShip"><option value="" data-i18n="alr.all"></option></select></div>
        <div class="fld" style="max-width:150px"><label data-i18n="alr.dept"></label>
          <select id="alDept"><option value="" data-i18n="alr.all"></option></select></div>
        <div class="fld" style="max-width:170px"><label data-i18n="alr.loc"></label>
          <select id="alLoc"><option value="" data-i18n="alr.all"></option></select></div>
        <button class="btn pri" id="btnAlLoad" data-i18n="alr.load"></button>
        <button class="btn" id="btnAlDemo" data-i18n="alr.demo"></button>
      </div>
      <div id="alListMsg"></div>
      <div class="wrap" style="max-height:38vh;margin-top:10px">
        <table id="alGrid"><thead></thead><tbody></tbody></table>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="alr.step2"></h2>
      <div class="row">
        <div class="fld" style="max-width:220px"><label data-i18n="alr.project"></label>
          <input id="alProject" value="FFE.KIT.05.2025" spellcheck="false"></div>
        <div class="fld" style="max-width:190px"><label data-i18n="alr.no"></label>
          <input id="alCode" spellcheck="false"></div>
        <div class="fld" style="max-width:150px"><label data-i18n="alr.date"></label>
          <input id="alDate" type="date"></div>
        <div class="fld" style="max-width:190px"><label data-i18n="alr.prep"></label>
          <input id="alPrep" value="Huỳnh Thị Trúc Dịu"></div>
        <div class="fld" style="max-width:190px"><label data-i18n="alr.recv"></label>
          <input id="alRecv" data-i18n-ph="alr.recvPh"></div>
      </div>
      <div class="fld grow" style="margin-top:11px">
        <label data-i18n="alr.notesLabel"></label>
        <textarea id="alNotes" style="min-height:130px"></textarea>
      </div>
      <div class="hint" data-i18n-html="alr.sinnova_html"></div>
    </div>

    <div class="card">
      <h2 data-i18n="alr.step3"></h2>
      <div class="row">
        <button class="btn pri" id="btnAlDoc" data-i18n="alr.buildDoc"></button>
        <button class="btn" id="btnAlLabels" data-i18n="alr.buildLabels"></button>
        <div class="fld" style="max-width:120px"><label data-i18n="alr.perRow"></label>
          <input id="alCols" type="number" min="1" max="6" value="3"></div>
        <button class="btn" id="btnAlPrint" disabled data-i18n="alr.print"></button>
        <button class="btn" id="btnAlSave" disabled data-i18n="alr.saveDb"></button>
      </div>
      <div id="alOutMsg"></div>
    </div>

    <div id="printRoot"></div>
  </section>

  </main>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
